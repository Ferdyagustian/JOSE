name: Daily Lakehouse ELT Pipeline

on:
  schedule:
    # Runs at 23:00 UTC every day (06:00 WIB)
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-lakehouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Java 17 for PySpark
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 1. Ingestion Bronze Layer (Glints, JobStreet, YouTube)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_CONTAINER_NAME: ${{ secrets.AZURE_CONTAINER_NAME }}
        run: |
          python -m src.ingestion.pipeline

      - name: 2. Silver Normalization & Delta Lake Merge (PySpark)
        run: |
          python -m src.spark_jobs.bronze_to_silver_jobs

      - name: 3. Gold Layer Modeling & SCD Type 2 Snapshots (dbt)
        run: |
          dbt snapshot --project-dir dbt_lakehouse --profiles-dir dbt_lakehouse
          dbt run --project-dir dbt_lakehouse --profiles-dir dbt_lakehouse
          dbt test --project-dir dbt_lakehouse --profiles-dir dbt_lakehouse

      - name: 4. Commit updated Gold Lakehouse database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gold/lakehouse.duckdb
          git commit -m "chore(lakehouse): auto-update daily gold database [skip ci]" || echo "No changes to commit"
          git push
